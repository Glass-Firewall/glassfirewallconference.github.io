#-------------------------------
# Site Settings
title: Glass Firewall
logo: "/images/GlassFirewallTitle.png" # You can add own logo. For example "/images/logo.svg".
#logo_dark: "/images/logo-dark.svg"
description: A free, hands-on cybersecurity conference for women who want to learn, practice, and connect.
color_scheme: auto # You can choose three modes auto, light, and dark. By default, the auto mode is set, which means the users can choose the light or dark mode themself.


#-------------------------------
# Author Settings
author_name: Catherine Cassell


#-------------------------------
# Navigation Settings
menu_settings:
  menu_items:
    - title: "Home"
      url: "/"
    - title: "Attend"
      url: "/attend/"
    - title: "Learn"
      url: "/start-here/"
    - title: "Years"
      url: "/previous-years/"
      submenu:
      - url: "/previous-years/2027/"
        title: "2027"
      - url: "/previous-years/2026/"
        title: "2026"
      - url: "/previous-years/2025/"
        title: "2025"
      - url: "/previous-years/2024/"
        title: "2024"
      - url: "/previous-years/2023/"
        title: "2023"
    - title: "Get involved"
      url: "/get-involved/"
    - title: "Partners"
      url: "/sponsorships/"
    - title: "About"
      url: "/about/"
    - title: "Contact"
      url: "/contact/"


#-------------------------------
# Social Settings
social:
- {icon: "x", label: "Follow Glass Firewall on X", link: "https://x.com/GlassFirewall"}

# Example of adding a new link to the header and footer - {icon: "fa-brands fa-youtube", link: "https://youtube.com"}
# Other icons can be found at https://fontawesome.com/icons


#-------------------------------
# Hero Settings
hero:
  enable: true
  hero_title: Glass Firewall - Breaking Bytes and Barriers # Add the "span" tag to highlight text.
  hero_description: A free conference for women exploring ethical hacking, cybersecurity careers, and hands-on learning in a welcoming community.
  hero_button_contact: Get Involved
  hero_button_contact_url: /get-involved/
  hero_button_about: About Glass Firewall


