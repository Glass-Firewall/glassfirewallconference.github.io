---
layout: default
---

<div class="container">
  <header class="resource-head">
    {% if page.eyebrow %}<span class="section-eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    {% if page.quick_links %}
    <nav class="resource-quick-links" aria-label="On this page">
      {% for link in page.quick_links %}
      <a href="#{{ link.anchor }}">{{ link.label }}</a>
      {% endfor %}
    </nav>
    {% endif %}
  </header>

  <article class="resource-page">
    {{ content }}
  </article>
</div>
